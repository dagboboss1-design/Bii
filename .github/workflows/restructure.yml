name: restructure-and-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python restructure.py
      - name: Commit new layout
        run: |
          git config user.name "restructure-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Restructure into package layout"
          git push
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
